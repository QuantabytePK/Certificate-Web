<mat-toolbar color="primary" class="container">
    <span><a mat-icon-button  routerLink="/" class="logo heading-text" [disableRipple]="true">Quantabytes</a></span>
    <span class="example-spacer" ></span>
    @if (!loginService.isLoggedIn) {
      @if(currentRoute == '/signup' || currentRoute =='/') {
        <a mat-icon-button routerLink="/login" class="login-signout-button">
          Login
        </a>
      } @else {
        <a mat-icon-button routerLink="/signup" class="login-signout-button">
          Sign Up
        </a>
      }
    } @else {
      <a mat-icon-button (click)="logout()" routerLink="/" class="login-signout-button">Logout</a>
    }
</mat-toolbar>
